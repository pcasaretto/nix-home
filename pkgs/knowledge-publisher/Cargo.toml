[package]
name = "knowledge-publisher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local qmd + Quick publisher for ~/knowledge"

[dependencies]
ammonia = "4.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
html-escape = "0.2"
notify = "6.1"
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"
